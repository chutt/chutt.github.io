    <!-- Lire la suite / Read more -->
    <script>
    function toggleDescription(link) {
        var text = link.previousElementSibling;
        if (text.classList.contains('collapsed')) {
            text.classList.remove('collapsed');
            text.classList.add('expanded');
            link.textContent = 'Réduire';
        } else {
            text.classList.remove('expanded');
            text.classList.add('collapsed');
            link.textContent = 'Lire la suite';
        }
    }

    // Scroll vers l'ancre au chargement de la page et expand l'article
    $(document).ready(function() {
        if (window.location.hash) {
            var target = $(window.location.hash);
            if (target.length) {
                // Expand l'article si il est collapsed
                var descText = target.find('.description-text.collapsed');
                if (descText.length) {
                    descText.removeClass('collapsed').addClass('expanded');
                    target.find('.lire-plus').text('Réduire');
                }
                // Scroll vers l'article
                $('html, body').animate({
                    scrollTop: target.offset().top - 80
                }, 500);
            }
        }
    });
    </script>
